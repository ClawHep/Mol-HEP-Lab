# HEP stage-to-agent mapping (18-stage consolidated pipeline).
# Keys are SCREAMING_SNAKE_CASE stage names (from Stage::name()).
# Values are agent file stems in agents/ directory.
stage_agents:
  TOPIC_INIT: lead-analyst
  PROBLEM_DECOMPOSE: lead-analyst
  LITERATURE_SEARCH: investigator           # ← SearchStrategy + LiteratureCollect
  LITERATURE_SCREEN: investigator
  KNOWLEDGE_EXTRACT: investigator
  SYNTHESIS_HYPOTHESES: theory-scout        # ← Synthesis + HypothesisGen
  EXPERIMENT_DESIGN: lead-analyst
  CODEBASE_SEARCH: signal-lead
  CODE_DEVELOP: signal-lead                 # ← CodeGeneration + SanityCheck
  EXPERIMENT_CYCLE: systematics-fitter      # ← ResourcePlanning + ExperimentRun + IterativeRefine
  RESULT_ANALYSIS: lead-analyst
  RESEARCH_DECISION: arbiter
  KNOWLEDGE_SUMMARY: lead-analyst
  PAPER_OUTLINE: note-writer
  PAPER_WRITE: note-writer                  # ← PaperDraft + PaperRevision
  PEER_REVIEW: physics-reviewer
  QUALITY_GATE: arbiter
  PUBLISH: note-writer                      # ← KnowledgeArchive + ExportPublish + CitationVerify
  DISCUSSION: note-writer

# Advisory agents: role definitions injected as {{ advisor_roles }}.
# The primary agent gets their expertise as reference context.
advisors:
  EXPERIMENT_DESIGN: [detector-specialist, data-explorer]
  CODEBASE_SEARCH: [data-explorer, detector-specialist]
  CODE_DEVELOP: [background-estimator, ml-specialist, plot-validator]   # ← from CodeGeneration + SanityCheck
  EXPERIMENT_CYCLE: [background-estimator, systematic-source-evaluator, ml-specialist]  # ← from ExperimentRun + IterativeRefine
  RESULT_ANALYSIS: [systematic-source-evaluator]
  PEER_REVIEW: [critical-reviewer, constructive-reviewer]
  QUALITY_GATE: [plot-validator, rendering-reviewer, critical-reviewer]
  PUBLISH: [rendering-reviewer]                                         # ← from ExportPublish
  DISCUSSION: [lead-analyst, theory-scout, cross-checker]
