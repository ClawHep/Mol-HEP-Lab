project:
  name: "hep-jet-attention"
  mode: "full-auto"

research:
  topic: "Dimuon invariant mass spectrum analysis using CMS open data: Z boson peak identification, background estimation, and signal extraction"
  domains:
    - "deep-learning"
    - "physics"
  daily_paper_count: 5
  quality_threshold: 3.0
  reference_papers: []
  analysis_type: "search"
  knowledge_root: "hep"

notifications:
  channel: "console"
  on_stage_start: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "docs/kb"

llm:
  provider: "acp"
  acp:
    agent: "claude"
    session: "mol-hep-run"
    timeout_sec: 0  # 0 = no timeout; runner monitors heartbeat/artifacts for liveness

security:
  hitl_required_stages: []

experiment:
  mode: "sandbox"
  time_budget_sec: 3600
  max_iterations: 5
  metric_key: "primary_metric"
  metric_direction: "minimize"
  datasets_dir: "hep/examples/test-opendata/data"
  checkpoints_dir: ""
  codebases_dir: ""
  shared_results_dir: "runs/shared_results"
  paper_length: "long"
  sandbox:
    python_path: "python3"
  sanity_check_max_iterations: 100

runtime:
  timezone: "Asia/Shanghai"

prompts:
  custom_file: ""
